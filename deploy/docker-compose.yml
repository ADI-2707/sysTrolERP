name: systrol-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: systrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: systrol
      POSTGRES_USER: systrol
      POSTGRES_PASSWORD: systrol_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systrol -d systrol"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: systrol-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://systrol:systrol_secure_password@postgres:5432/systrol
      SECRET_KEY: django-insecure-prod-key-please-replace-in-env-file
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      COMPANY_TIMEZONE: Asia/Kolkata
      SUPER_ADMIN_USERNAME: "9999"
      SUPER_ADMIN_PASSWORD_HASH: "argon2$$argon2id$$v=19$$m=102400,t=2,p=8$$c3lzdHJvbHNhbHQxMjM0NQ$$Im4hGYap+wRFU03vDqtv8jaOnnv9yCou15NvR1UFj0Y"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    container_name: systrol-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  staticfiles:
